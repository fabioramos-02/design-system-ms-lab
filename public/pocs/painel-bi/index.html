<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Atendimentos — POC de BI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Mulish:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../tokens/ds-tokens.css?v=20261125c">
<link rel="stylesheet" href="../../shared/lab.css?v=20261125c">
<style>
  body { margin: 0; }
  .lab { padding: 0; }
  .lab-shell { margin: 0; }
  .lab-main { max-width: 1320px; width: 100%; margin: 0 auto; }
  .cabeca { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
  .densidade { display: inline-flex; border: 1px solid var(--ds-color-border-strong); border-radius: var(--ds-radius-huge); overflow: hidden; }
  .densidade button { all: unset; cursor: pointer; padding: 6px 12px; font-size: 13px; }
  .densidade button[aria-pressed='true'] { background: var(--ds-color-brand-skyline); color: #fff; font-weight: 600; }
  .barra-clicavel rect { cursor: pointer; }
  .barra-clicavel rect:hover, .barra-clicavel rect:focus { opacity: .8; outline: none; stroke: var(--ds-color-focus); stroke-width: 3; }
  .dica { font-size: 12px; color: var(--ds-color-text-muted); }
</style>
</head>
<body>
<div class="lab" data-density="default" id="app"></div>
<p class="sr-only" aria-live="polite" id="anuncio"></p>
<script type="module" src="app.js?v=20261125c"></script>
</body>
</html>
